{{- if .Values.ingress.dns }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    {{ if .Values.ingress.tls.enabled }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    {{- if .Values.ingress.tls.certIssuer }}
    cert-manager.io/issuer: {{ .Values.ingress.tls.certIssuer | quote}}
    {{- end }}
    {{ end }}
    nginx.ingress.kubernetes.io/proxy-buffer-size: 12k
    nginx.ingress.kubernetes.io/proxy-body-size: 5g
spec:
  {{ if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range (default (list .Values.ingress.dns) .Values.ingress.tls.hosts) }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ default (printf "%s-tls-secret" .Release.Name) .Values.ingress.tls.secretName | quote }}
  {{ end }}
  rules:
    - host: {{ .Values.ingress.dns }}
      http:
        paths:
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: {{ .Release.Name }}-backend
              port:
                number: 5000
{{- if and .Values.frontend.seoRenderer.enabled (empty .Values.frontend.basicAuth.htpasswd) }}
        - path: /resource
          pathType: Prefix
          backend:
            service:
              name: {{ .Release.Name }}-frontend-seo-renderer
              port:
                number: 3000
{{- end }}
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ .Release.Name }}-frontend
              port:
                number: 80
{{- end }}
