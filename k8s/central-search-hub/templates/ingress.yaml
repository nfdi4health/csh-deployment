{{- if .Values.ingress.dns }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-backend-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-buffer-size: 12k
    nginx.ingress.kubernetes.io/proxy-body-size: 5g
    {{ if .Values.ingress.tls.enabled }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    {{ end }}
spec:
  {{ if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range (default (list .Values.ingress.dns) .Values.ingress.tls.hosts) }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ default (printf "%s-tls-secret" .Release.Name) .Values.ingress.tls.secretName | quote }}
  {{ end }}
  rules:
    - host: {{ .Values.ingress.dns }}
      http:
        paths:
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: {{ .Release.Name }}-backend
              port:
                number: 5000
{{- end }}
---
{{- if .Values.ingress.dns }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-frontend-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-buffer-size: 12k
    nginx.ingress.kubernetes.io/proxy-body-size: 5g
    {{ if .Values.ingress.tls.enabled }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    {{- if .Values.ingress.tls.certIssuer }}
    cert-manager.io/issuer: {{ .Values.ingress.tls.certIssuer | quote}}
    {{- end }}
    {{ end }}
    {{ if .Values.ingress.basicAuth.enabled }}
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: "{{ .Release.Name }}-basic-auth-secret"
    {{ end }}
spec:
  {{ if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range (default (list .Values.ingress.dns) .Values.ingress.tls.hosts) }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ default (printf "%s-tls-secret" .Release.Name) .Values.ingress.tls.secretName | quote }}
  {{ end }}
  rules:
    - host: {{ .Values.ingress.dns }}
      http:
        paths:
{{- if .Values.frontend.seoRenderer.enabled }}
        - path: /resource
          pathType: Prefix
          backend:
            service:
              name: {{ .Release.Name }}-frontend-seo-renderer
              port:
                number: 3000
{{- end }}
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ .Release.Name }}-frontend
              port:
                number: 80
{{- end }}
{{- if .Values.ingress.basicAuth.enabled }}
  {{- $username := required "ingress.basicAuth.username is required when basicAuth is enabled" .Values.ingress.basicAuth.username }}
  {{- $password := required "ingress.basicAuth.password is required when basicAuth is enabled" .Values.ingress.basicAuth.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-basic-auth-secret
type: Opaque
stringData:
  auth: {{ htpasswd $username $password | quote }}
{{- end }}
